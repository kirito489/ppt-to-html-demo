tags: [Profile]
summary: 查詢個人帳號資料
description: 取得目前登入帳號的基本資料（持有有效 JWT 即可）。

security:
  - bearerAuth: []

responses:
  '200':
    description: 查詢成功
    content:
      application/json:
        schema:
          type: object
          required: [success, data, timestamp]
          properties:
            success:
              type: boolean
              example: true
            data:
              type: object
              required: [id, email, name]
              properties:
                id:
                  type: string
                  format: uuid
                email:
                  type: string
                  format: email
                name:
                  type: string
                  description: 會員名稱（顯示用）
            timestamp:
              type: string
              format: date-time
        example:
          success: true
          data:
            id: '11111111-1111-4111-8111-111111111111'
            email: admin@test.com
            name: 管理員
          timestamp: '2026-06-05T10:00:00.000Z'

  '401':
    $ref: '../openapi.yaml#/components/responses/NoToken'
  '500':
    $ref: '../openapi.yaml#/components/responses/InternalServerError'
