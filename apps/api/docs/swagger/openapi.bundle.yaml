                required:
                  - success
                  - data
                  - timestamp
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    required:
                      - items
                      - meta
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          required:
                            - id
                            - trigger
                            - startedAt
                            - finishedAt
                            - filesScanned
                            - filesConverted
                            - filesFailed
                            - detail
                            - createdAt
                          properties:
