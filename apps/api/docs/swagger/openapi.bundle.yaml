                              type: integer
                            elements:
                              type: array
                              items:
                                type: object
                                required:
                                  - kind
                                  - restored
                                properties:
                                  kind:
                                    type: string
                                    enum:
                                      - text
                                      - image
                                      - table
                                      - unsupported
                                  restored:
                                    type: boolean
                                    description: 是否成功還原到 HTML
                                  text:
                                    type: string
                                    nullable: true
                                  image:
                                    type: string
                                    nullable: true
                                    description: 圖片 data URI（成功擷取時）
