tags: [Articles]
summary: 取得單篇轉換文章
description: |
  取得單篇文章完整內容：不跑版 HTML、分類準確率（含每頁明細）、
  以及供「來源元素對照」面板使用的逐頁元素清單。

security:
  - bearerAuth: []

parameters:
  - in: path
    name: id
    required: true
    schema: { type: string, format: uuid }
    description: 文章 ID

responses:
  '200':
    description: 查詢成功
    content:
      application/json:
        schema:
          type: object
          required: [success, data, timestamp]
          properties:
            success: { type: boolean, example: true }
            data:
              type: object
              required:
                - id
                - title
                - sourceFilename
                - html
                - inventory
                - slideCount
                - accuracy
                - status
                - createdAt
              properties:
                id: { type: string, format: uuid }
                title: { type: string }
                sourceFilename: { type: string }
                html:
                  type: string
                  description: 不跑版的完整 HTML（多頁堆疊，圖片以 data URI 內嵌）
                slideCount: { type: integer }
                status:
                  type: string
                  enum: [success, partial, failed]
                createdAt: { type: string, format: date-time }
                accuracy:
                  type: object
                  required: [overall, text, image, coverage, slides]
                  properties:
                    overall: { type: number, description: 整體準確率（0~1） }
                    text: { type: number, description: 文字還原正確率 }
                    image: { type: number, description: 圖片擷取成功率 }
                    coverage: { type: number, description: 元素涵蓋率 }
                    slides:
                      type: array
                      description: 每頁準確率明細
                      items:
                        type: object
                        required: [index, coverage, text, image, overall]
                        properties:
                          index: { type: integer }
                          coverage: { type: number }
                          text: { type: number }
                          image: { type: number }
                          overall: { type: number }
                inventory:
                  type: array
                  description: 逐頁來源元素清單（對照面板用）
                  items:
                    type: object
                    required: [index, elements]
                    properties:
                      index: { type: integer }
                      elements:
                        type: array
                        items:
                          type: object
                          required: [kind, restored]
                          properties:
                            kind:
                              type: string
                              enum: [text, image, table, unsupported]
                            restored:
                              type: boolean
                              description: 是否成功還原到 HTML
                            text: { type: string, nullable: true }
                            image:
                              type: string
                              nullable: true
                              description: 圖片 data URI（成功擷取時）
                            tableCells:
                              type: array
                              nullable: true
                              items:
                                type: array
                                items: { type: string }
                            unsupportedType:
                              type: string
                              nullable: true
                              description: 未支援元素型別（chart / smartArt 等）
            timestamp: { type: string, format: date-time }
  '401':
    $ref: '../openapi.yaml#/components/responses/NoToken'
  '404':
    description: 找不到文章
    content:
      application/json:
        schema:
          $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
        example:
          success: false
          message: 找不到指定的文章
          code: ARTICLE_NOT_FOUND
          timestamp: '2026-06-05T00:00:00.000Z'
  '500':
    $ref: '../openapi.yaml#/components/responses/InternalServerError'
