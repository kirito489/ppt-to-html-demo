openapi: 3.0.0
info:
  title: PPT 轉 HTML Demo API
  version: 1.0.0
  description: |
    定時抓取公槽 PPT、轉成不跑版 HTML 並提供準確率的後端 API（NestJS 六角架構）
servers:
  - url: 'http://localhost:3000/api'
    description: 本地開發環境
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        使用 Access Token 進行身份驗證

        格式: Bearer {accessToken}
  schemas:
    SuccessResponse:
      type: object
      description: 通用成功回應格式
      required:
        - success
        - timestamp
      properties:
        success:
          type: boolean
          description: 操作是否成功
          example: true
        data:
          type: object
          description: 回應資料
          nullable: true
        timestamp:
          type: string
          format: date-time
          description: 回應時間
          example: '2024-01-01T00:00:00.000Z'
    ErrorResponse:
      type: object
      description: 通用錯誤回應格式
      required:
        - success
        - timestamp
      properties:
        success:
          type: boolean
          description: 操作是否成功
          example: false
        message:
          type: string
          description: 錯誤訊息
          example: 發生錯誤
        code:
          type: string
          description: 錯誤代碼
          example: ERROR_CODE
        timestamp:
          type: string
          format: date-time
          description: 回應時間
          example: '2024-01-01T00:00:00.000Z'
  responses:
    BadRequest:
      description: 請求參數錯誤
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: 請求參數錯誤
            code: BAD_REQUEST
            timestamp: '2024-01-01T00:00:00.000Z'
    NoToken:
      description: 缺少授權憑證
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: 缺少授權憑證，請先登入
            code: NO_TOKEN
            timestamp: '2024-01-01T00:00:00.000Z'
    TokenRevoked:
      description: Token 已登出或失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Token 已登出或失效
            code: TOKEN_REVOKED
            timestamp: '2024-01-01T00:00:00.000Z'
    TokenExpired:
      description: Token 已過期
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Token 已過期
            code: TOKEN_EXPIRED
            timestamp: '2024-01-01T00:00:00.000Z'
    InvalidToken:
      description: Token 無效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Token 無效
            code: INVALID_TOKEN
            timestamp: '2024-01-01T00:00:00.000Z'
    Forbidden:
      description: 權限不足
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: 權限不足
            code: FORBIDDEN
            timestamp: '2024-01-01T00:00:00.000Z'
    NotFound:
      description: 資源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: 資源不存在
            code: NOT_FOUND
            timestamp: '2024-01-01T00:00:00.000Z'
    Conflict:
      description: 資源已存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: 資源已存在
            code: CONFLICT
            timestamp: '2024-01-01T00:00:00.000Z'
    InternalServerError:
      description: 伺服器內部錯誤
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: 伺服器發生未預期錯誤
            code: INTERNAL_SERVER_ERROR
            timestamp: '2024-01-01T00:00:00.000Z'
paths:
  /health:
    get:
      tags:
        - Health
      summary: 存活探針（liveness）
      description: |
        確認 API 行程是否存活，永遠輕量回 200，不檢查任何外部依賴。
        供 k8s livenessProbe / 負載平衡器存活檢查使用。無需認證。
      responses:
        '200':
          description: 行程存活
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - timestamp
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    required:
                      - status
                      - timestamp
                    properties:
                      status:
                        type: string
                        description: 固定為 ok
                        example: ok
                      timestamp:
                        type: string
                        format: date-time
                        description: 探針回應時間
                  timestamp:
                    type: string
                    format: date-time
              example:
                success: true
                data:
                  status: ok
                  timestamp: '2024-01-01T00:00:00.000Z'
                timestamp: '2024-01-01T00:00:00.000Z'
  /health/ready:
    get:
      tags:
        - Health
      summary: 就緒探針（readiness）
      description: |
        檢查 API 是否可服務流量：主動探測資料庫（SELECT 1）與 Redis（PING）。
        任一依賴異常時回 503，供 k8s readinessProbe 暫停導流。無需認證。
      responses:
        '200':
          description: 所有依賴正常
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - timestamp
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    description: terminus 健康檢查結果
                    required:
                      - status
                      - info
                      - error
                      - details
                    properties:
                      status:
                        type: string
                        description: 整體狀態（全部正常為 ok）
                        example: ok
                      info:
                        type: object
                        description: 正常依賴的明細
                      error:
                        type: object
                        description: 異常依賴的明細（全部正常時為空物件）
                      details:
                        type: object
                        description: 所有依賴的彙整明細
                  timestamp:
                    type: string
                    format: date-time
              example:
                success: true
                data:
                  status: ok
                  info:
                    database:
                      status: up
                    redis:
                      status: up
                  error: {}
                  details:
                    database:
                      status: up
                    redis:
                      status: up
                timestamp: '2024-01-01T00:00:00.000Z'
        '503':
          description: |
            一個以上依賴異常（DB 無法查詢或 Redis 無回應）。
            逐項細節經由全域例外過濾器收斂為標準錯誤格式，code 為 SERVICE_UNAVAILABLE。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Service Unavailable
                code: SERVICE_UNAVAILABLE
                timestamp: '2024-01-01T00:00:00.000Z'
  /auth/login:
    post:
      tags:
        - Auth
      summary: 登入
      description: |
        使用 Email 與密碼登入，成功後取得 JWT Access Token 與 Refresh Token。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  description: 電子郵件
                  example: test@example.com
                password:
                  type: string
                  format: password
                  description: 密碼
                  example: mypassword123
      responses:
        '200':
          description: 登入成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - timestamp
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    description: 登入結果
                    required:
                      - accessToken
                      - refreshToken
                      - accessTokenExpiresIn
                      - refreshTokenExpiresIn
                      - member
                    properties:
                      accessToken:
                        type: string
                        description: Access Token
                      refreshToken:
                        type: string
                        description: Refresh Token
                      accessTokenExpiresIn:
                        type: integer
                        description: Access Token 絕對有效期（秒）
                      refreshTokenExpiresIn:
                        type: integer
                        description: Refresh Token 絕對有效期（秒）
                      member:
                        type: object
                        description: 帳號摘要
                        required:
                          - id
                          - email
                          - member
                          - roleName
                        properties:
                          id:
                            type: string
                            format: uuid
                            description: 帳號 ID
                          email:
                            type: string
                            format: email
                            description: Email
                          member:
                            type: string
                            description: 名稱
                          roleName:
                            type: string
                            description: 所屬角色名稱
                  timestamp:
                    type: string
                    format: date-time
              example:
                success: true
                data:
                  accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  accessTokenExpiresIn: 900
                  refreshTokenExpiresIn: 604800
                  member:
                    id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                    email: test@example.com
                    member: Alan
                    roleName: ADMIN
                timestamp: '2024-01-01T00:00:00.000Z'
        '401':
          description: 帳號或密碼錯誤
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: 帳號或密碼錯誤
                code: UNAUTHORIZED
                timestamp: '2024-01-01T00:00:00.000Z'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/logout:
    post:
      tags:
        - Auth
      summary: 登出
      description: |
        登出並將 Access Token 加入黑名單。
        若同時傳入 Refresh Token，也會一併加入黑名單。
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: Refresh Token（選填，一併廢棄）
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        '204':
          description: 登出成功（無回應內容）
        '401':
          $ref: '#/components/responses/NoToken'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/refresh:
    post:
      tags:
        - Auth
      summary: 更新 Access Token
      description: |
        使用 Refresh Token 取得新的 Access Token 與新的 Refresh Token（rotation）。
        舊 Refresh Token 會立即加入黑名單；如果同一個舊 Refresh Token 再次被用 → 401。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  description: Refresh Token
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - timestamp
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    description: 更新後的 token 雙包
                    required:
                      - accessToken
                      - accessTokenExpiresIn
                      - refreshToken
                      - refreshTokenExpiresIn
                    properties:
                      accessToken:
                        type: string
                        description: 新的 Access Token
                      accessTokenExpiresIn:
                        type: integer
                        description: Access Token 絕對有效期（秒）
                      refreshToken:
                        type: string
                        description: 新的 Refresh Token（舊 token 已加入黑名單）
                      refreshTokenExpiresIn:
                        type: integer
                        description: Refresh Token 絕對有效期（秒）
                  timestamp:
                    type: string
                    format: date-time
              example:
                success: true
                data:
                  accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  accessTokenExpiresIn: 7200
                  refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  refreshTokenExpiresIn: 604800
                timestamp: '2024-01-01T00:00:00.000Z'
        '401':
          description: Refresh Token 無效或已失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Refresh Token 無效
                code: INVALID_REFRESH_TOKEN
                timestamp: '2024-01-01T00:00:00.000Z'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /me:
    get:
      tags:
        - Profile
      summary: 查詢個人帳號資料
      description: |
        取得目前登入帳號的個人資料。
        無需任何額外 permission，持有有效 JWT 即可呼叫。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 查詢成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - timestamp
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    description: 帳號詳細
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: 帳號 ID
                      email:
                        type: string
                        format: email
                        description: Email
                      member:
                        type: string
                        description: 名稱
                      roleId:
                        type: string
                        format: uuid
                        description: 所屬角色 ID
                      roleName:
                        type: string
                        description: 角色名稱
                      roleCode:
                        type: string
                        nullable: true
                        description: 角色代碼（如 SUPERADMIN），給前端 sidebar 粗粒度 role gate 用；context 取不到時為 null
                        example: SUPERADMIN
                      status:
                        type: boolean
                        description: 啟用狀態
                      isDefault:
                        type: boolean
                        description: 預設帳號旗標
                      lastLoginAt:
                        type: string
                        format: date-time
                        nullable: true
                        description: 最後登入時間（UTC，可 null）
                      createdAt:
                        type: string
                        format: date-time
                        description: 建立時間（UTC）
                      updatedAt:
                        type: string
                        format: date-time
                        description: 更新時間（UTC）
                      permissionCodes:
                        type: array
                        items:
                          type: string
                        description: 該帳號目前持有的權限代碼（即時查 DB，非 JWT 快取）
                        example:
                          - 'BACKEND:ACCOUNT:VIEW'
                          - 'BACKEND:ACCOUNT:EDIT'
                  timestamp:
                    type: string
                    format: date-time
              example:
                success: true
                data:
                  id: 11111111-1111-4111-8111-111111111111
                  email: user@example.com
                  member: 王小明
                  roleId: 22222222-2222-4222-8222-222222222222
                  roleName: 管理者
                  roleCode: SUPERADMIN
                  status: true
                  isDefault: false
                  lastLoginAt: '2026-04-30T10:00:00.000Z'
                  createdAt: '2026-01-01T00:00:00.000Z'
                  updatedAt: '2026-04-30T10:00:00.000Z'
                  permissionCodes:
                    - 'BACKEND:ACCOUNT:VIEW'
                    - 'BACKEND:ACCOUNT:EDIT'
                timestamp: '2026-04-30T10:00:00.000Z'
        '401':
          $ref: '#/components/responses/NoToken'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /articles:
    get:
      tags:
        - Articles
      summary: 轉換文章列表（分頁）
      description: 取得由 PPT 轉換而來的文章清單（精簡欄位），依建立時間倒序。
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: 頁碼
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: 每頁筆數
      responses:
        '200':
          description: 查詢成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - timestamp
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    required:
                      - items
                      - meta
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          required:
                            - id
                            - title
                            - sourceFilename
                            - slideCount
                            - accuracyOverall
                            - status
                            - createdAt
                          properties:
                            id:
                              type: string
                              format: uuid
                            title:
                              type: string
                              description: 文章標題
                            sourceFilename:
                              type: string
                              description: 來源 PPT 檔名
                            slideCount:
                              type: integer
                              description: 投影片頁數
                            accuracyOverall:
                              type: number
                              description: 整體準確率（0~1）
                            status:
                              type: string
                              enum:
                                - success
                                - partial
                                - failed
                              description: 轉換狀態
                            createdAt:
                              type: string
                              format: date-time
                      meta:
                        type: object
                        required:
                          - page
                          - limit
                          - total
                          - totalPages
                        properties:
                          page:
                            type: integer
                          limit:
                            type: integer
                          total:
                            type: integer
                          totalPages:
                            type: integer
                  timestamp:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/NoToken'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /articles/ingest:
    post:
      tags:
        - Articles
      summary: 手動觸發一次攝取
      description: |
        立即掃描來源資料夾（模擬公槽）、轉換所有 .pptx、存檔並依策略處置來源檔，
        回傳本批次結果摘要。demo 方便用，正式由排程自動執行。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 攝取完成
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - timestamp
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    required:
                      - id
                      - trigger
                      - startedAt
                      - finishedAt
                      - filesScanned
                      - filesConverted
                      - filesFailed
                      - detail
                      - createdAt
                    properties:
                      id:
                        type: string
                        format: uuid
                      trigger:
                        type: string
                        enum:
                          - scheduled
                          - manual
                      startedAt:
                        type: string
                        format: date-time
                      finishedAt:
                        type: string
                        format: date-time
                        nullable: true
                      filesScanned:
                        type: integer
                      filesConverted:
                        type: integer
                      filesFailed:
                        type: integer
                      createdAt:
                        type: string
                        format: date-time
                      detail:
                        type: array
                        items:
                          type: object
                          required:
                            - filename
                            - status
                          properties:
                            filename:
                              type: string
                            status:
                              type: string
                              enum:
                                - success
                                - failed
                            articleId:
                              type: string
                              format: uuid
                              nullable: true
                            accuracyOverall:
                              type: number
                              nullable: true
                            error:
                              type: string
                              nullable: true
                  timestamp:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/NoToken'
        '500':
          $ref: '#/components/responses/InternalServerError'
  '/articles/{id}':
    get:
      tags:
        - Articles
      summary: 取得單篇轉換文章
      description: |
        取得單篇文章完整內容：不跑版 HTML、分類準確率（含每頁明細）、
        以及供「來源元素對照」面板使用的逐頁元素清單。
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: 文章 ID
      responses:
        '200':
          description: 查詢成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - timestamp
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    required:
                      - id
                      - title
                      - sourceFilename
                      - html
                      - inventory
                      - slideCount
                      - accuracy
                      - status
                      - createdAt
                    properties:
                      id:
                        type: string
                        format: uuid
                      title:
                        type: string
                      sourceFilename:
                        type: string
                      html:
                        type: string
                        description: 不跑版的完整 HTML（多頁堆疊，圖片以 data URI 內嵌）
                      slideCount:
                        type: integer
                      status:
                        type: string
                        enum:
                          - success
                          - partial
                          - failed
                      createdAt:
                        type: string
                        format: date-time
                      accuracy:
                        type: object
                        required:
                          - overall
                          - text
                          - image
                          - coverage
                          - slides
                        properties:
                          overall:
                            type: number
                            description: 整體準確率（0~1）
                          text:
                            type: number
                            description: 文字還原正確率
                          image:
                            type: number
                            description: 圖片擷取成功率
                          coverage:
                            type: number
                            description: 元素涵蓋率
                          slides:
                            type: array
                            description: 每頁準確率明細
                            items:
                              type: object
                              required:
                                - index
                                - coverage
                                - text
                                - image
                                - overall
                              properties:
                                index:
                                  type: integer
                                coverage:
                                  type: number
                                text:
                                  type: number
                                image:
                                  type: number
                                overall:
                                  type: number
                      inventory:
                        type: array
                        description: 逐頁來源元素清單（對照面板用）
                        items:
                          type: object
                          required:
